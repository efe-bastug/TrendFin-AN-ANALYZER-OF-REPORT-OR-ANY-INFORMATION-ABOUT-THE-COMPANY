version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mini_guru_postgres_prod
    environment:
      POSTGRES_DB: mini_guru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mini_guru_network
    restart: unless-stopped

  vector:
    image: qdrant/qdrant:v1.7.4
    container_name: mini_guru_qdrant_prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mini_guru_network
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mini_guru_backend_prod
    command: gunicorn mini_guru.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gevent --worker-connections 1000 --max-requests 1000 --max-requests-jitter 100 --timeout 30 --keep-alive 2
    volumes:
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=http://vector:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHUNK_SIZE=${CHUNK_SIZE:-400}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      - postgres
      - vector
    networks:
      - mini_guru_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: mini_guru_frontend_prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=production
    depends_on:
      - web
    networks:
      - mini_guru_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mini_guru_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - static_files:/var/www/static
    depends_on:
      - frontend
      - web
    networks:
      - mini_guru_network
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  media_files:
  static_files:

networks:
  mini_guru_network:
    driver: bridge 